<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="robots" content="noindex">
<title>Live ratings · What should I teach next?</title>
<style>
  /* Live results for the /next/ rating form. Reads aggregates from the Apps Script web app
     (apps-script/Code.gs) every few seconds. Add ?demo to preview with sample data. */
  :root{
    --ground: oklch(0.145 0.005 240);
    --hair: oklch(0.315 0.009 240);
    --hair-soft: oklch(0.245 0.008 240);
    --ink: oklch(0.965 0.004 240);
    --muted: oklch(0.780 0.008 240);
    --dim: oklch(0.680 0.010 240);
    --signal: oklch(0.800 0.125 210);
    --signal-low: oklch(0.470 0.070 210);
    --warn: oklch(0.800 0.120 60);
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --e-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --e-expo: cubic-bezier(0.16, 1, 0.3, 1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{background:var(--ground); color-scheme:dark;}
  body{min-height:100dvh; color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;}
  main{max-width:1120px; margin:0 auto; padding:max(32px, env(safe-area-inset-top)) 20px 48px;}

  header{display:flex; justify-content:space-between; align-items:flex-end; gap:32px;}
  .brand{width:44px; height:3px; background:var(--signal); margin-bottom:24px;}
  h1{font-size:clamp(28px, 4.2vw, 52px); line-height:1.08; letter-spacing:-0.025em; font-weight:750; text-wrap:balance;}
  .live{display:flex; align-items:center; gap:10px; margin-top:14px; font-size:15px; color:var(--muted);}
  .live b{color:var(--ink); font-weight:650; font-variant-numeric:tabular-nums;}
  .pulse{width:8px; height:8px; border-radius:50%; background:var(--signal); flex:none;}
  .live.warn{color:var(--warn);} .live.warn .pulse{background:var(--warn);}
  .live.ok .pulse{animation:beat 2.4s var(--e-quart) infinite;}
  @keyframes beat{0%,100%{box-shadow:0 0 0 0 oklch(0.800 0.125 210 / .5);} 60%{box-shadow:0 0 0 7px oklch(0.800 0.125 210 / 0);}}
  .scan{display:none; flex-direction:column; align-items:center; gap:10px; flex:none;}
  .scan .code{width:150px; height:150px; background:#fff; border-radius:10px; padding:12px;}
  .scan .code svg{width:100%; height:100%; display:block;}
  .scan span{font-size:14px; color:var(--muted);}
  @media (min-width:900px){ .scan{display:flex;} }

  /* ---------- the ranking ---------- */
  .rows{list-style:none; margin-top:40px; position:relative;}
  .row{display:grid; grid-template-columns:48px 1fr auto; grid-template-areas:"rank name avg" "rank stars dist";
    column-gap:18px; row-gap:10px; align-items:center; padding:22px 0; border-top:1px solid var(--hair-soft);}
  .row:last-child{border-bottom:1px solid var(--hair-soft);}
  .rank{grid-area:rank; align-self:start; font-family:var(--mono); font-size:22px; color:var(--dim); padding-top:4px; font-variant-numeric:tabular-nums;}
  .name{grid-area:name; font-size:clamp(20px, 2.4vw, 30px); font-weight:700; letter-spacing:-0.015em; line-height:1.15;}
  .avg{grid-area:avg; font-family:var(--mono); font-size:clamp(30px, 4vw, 52px); font-weight:700; letter-spacing:-0.03em;
    color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; line-height:1;}
  .avg small{font-size:.38em; color:var(--dim); letter-spacing:0; margin-left:4px; font-weight:500;}
  .row.lead .rank, .row.lead .avg{color:var(--signal);}
  .meter{grid-area:stars; position:relative; width:max-content; height:26px;}
  .meter .base, .meter .fill{display:flex; gap:4px;}
  .meter svg{width:26px; height:26px; flex:none;}
  .meter .base{color:var(--hair);}
  .meter .fill{position:absolute; inset:0; color:var(--signal); clip-path:inset(0 calc(100% - var(--w, 0%)) 0 0);
    transition:clip-path .8s var(--e-expo);}
  .meter .count{position:absolute; left:calc(100% + 14px); top:50%; transform:translateY(-50%); white-space:nowrap;
    font-size:14px; color:var(--dim); font-variant-numeric:tabular-nums;}
  /* distribution of 1-5 star votes: bare bars, no tracks */
  .dist{grid-area:dist; display:flex; gap:6px; align-items:flex-end; height:40px; justify-self:end;}
  .dist div{display:flex; flex-direction:column; align-items:center; gap:4px; width:18px;}
  .dist i{display:block; width:100%; height:calc(var(--f, 0) * 28px); min-height:2px; background:var(--hair); border-radius:2px;
    transition:height .6s var(--e-expo);}
  .dist div:last-child i{background:var(--signal-low);}
  .row.lead .dist div:last-child i{background:var(--signal);}
  .dist b{font-family:var(--mono); font-size:11px; font-weight:400; color:var(--dim);}

  .note{margin-top:28px; font-size:15px; color:var(--dim); max-width:60ch;}
  .banner{display:none; margin-top:18px; font-size:14px; color:var(--warn);}
  .banner.on{display:block;}

  /* loading skeleton matches the row layout */
  .row.skel .name, .row.skel .avg{color:transparent; background:var(--hair-soft); border-radius:6px;}
  .row.skel .name{width:min(320px, 60%); height:26px;}
  .row.skel .avg{width:80px; height:40px;}

  @media (max-width:560px){
    .row{grid-template-columns:34px 1fr auto; column-gap:12px;}
    .rank{font-size:17px;}
    .meter svg{width:20px; height:20px;} .meter{height:20px;}
    .meter .count{display:none;}
    .dist{height:30px;} .dist div{width:12px;} .dist i{height:calc(var(--f, 0) * 16px);}
  }
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{transition:none !important; animation:none !important;}
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Phosphor Icons "star" regular + fill (MIT) -->
  <symbol id="so" viewBox="0 0 256 256"><path fill="currentColor" d="M239.18,97.26A16.38,16.38,0,0,0,224.92,86l-59-4.76L143.14,26.15a16.36,16.36,0,0,0-30.27,0L90.11,81.23,31.08,86a16.46,16.46,0,0,0-9.37,28.86l45,38.83L53,211.75a16.38,16.38,0,0,0,24.5,17.82L128,198.49l50.53,31.08A16.4,16.4,0,0,0,203,211.75l-13.76-58.07,45-38.83A16.43,16.43,0,0,0,239.18,97.26Zm-15.34,5.47-48.7,42a8,8,0,0,0-2.56,7.91l14.88,62.8a.37.37,0,0,1-.17.48c-.18.14-.23.11-.38,0l-54.72-33.650a8,8,0,0,0-8.38,0L69.09,215.94c-.15.09-.19.12-.38,0a.37.37,0,0,1-.17-.48l14.88-62.8a8,8,0,0,0-2.56-7.91l-48.7-42c-.12-.1-.23-.19-.13-.5s.18-.27.33-.29l63.92-5.16A8,8,0,0,0,103,91.86l24.62-59.61c.08-.17.11-.25.35-.25s.27.08.35.25L153,91.86a8,8,0,0,0,6.75,4.92l63.92,5.16c.15,0,.24,0,.33.29S224,102.63,223.84,102.73Z"/></symbol>
  <symbol id="sf" viewBox="0 0 256 256"><path fill="currentColor" d="M234.29,114.85l-45,38.83L203,211.75a16.4,16.4,0,0,1-24.5,17.82L128,198.49,77.47,229.57A16.4,16.4,0,0,1,53,211.75l13.76-58.07-45-38.83A16.46,16.46,0,0,1,31.08,86l59-4.76,22.76-55.08a16.36,16.36,0,0,1,30.27,0l22.75,55.08,59,4.76a16.46,16.46,0,0,1,9.37,28.86Z"/></symbol>
</svg>

<main>
  <header>
    <div>
      <div class="brand"></div>
      <h1>What should I teach next?</h1>
      <p class="live" id="live"><span class="pulse"></span><span id="liveText">Connecting&hellip;</span></p>
    </div>
    <div class="scan">
      <div class="code" role="img" aria-label="QR code for the rating form"><!--__FORM_QR__--></div>
      <span>Scan to rate</span>
    </div>
  </header>
  <p class="banner" id="banner"></p>
  <ol class="rows" id="rows" aria-live="polite"></ol>
  <p class="note" id="note"></p>
</main>

<script>
(function () {
  var ENDPOINT = '__ENDPOINT__';
  var POLL_MS = 5000;
  var TOPICS = { peptides: 'Peptides', skincare: 'Pharmaceutical Skincare', peds: 'Performance Enhancing Drugs', height: 'Height Pharmacology' };
  var IDS = Object.keys(TOPICS);
  var demo = /[?&]demo\b/.test(location.search);
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var rowsEl = document.getElementById('rows'), live = document.getElementById('live'), liveText = document.getElementById('liveText');
  var banner = document.getElementById('banner'), note = document.getElementById('note');
  var rows = {}, shown = {}, timer = null, lastOk = null;

  var STARS = '';
  for (var s = 0; s < 5; s++) STARS += '<svg aria-hidden="true"><use href="#so"/></svg>';
  var FILLS = STARS.replace(/#so/g, '#sf');

  IDS.forEach(function (id) {
    var li = document.createElement('li');
    li.className = 'row skel';
    li.innerHTML = '<span class="rank"></span><span class="name">' + TOPICS[id] + '</span><span class="avg">0.0</span>' +
      '<div class="meter" role="img"><div class="base">' + STARS + '</div><div class="fill">' + FILLS + '</div><span class="count"></span></div>' +
      '<div class="dist" aria-hidden="true">' + [1, 2, 3, 4, 5].map(function (k) { return '<div><i></i><b>' + k + '</b></div>'; }).join('') + '</div>';
    rowsEl.appendChild(li);
    rows[id] = li;
    shown[id] = 0;
  });

  function avgOf(t) { return t.count ? t.sum / t.count : 0; }

  function render(data) {
    var n = data.responses || 0;
    live.className = 'live ok';
    liveText.innerHTML = '<b>' + n + '</b> ' + (n === 1 ? 'response' : 'responses') + ', updating live';
    banner.className = 'banner' + (demo ? ' on' : '');
    if (demo) banner.textContent = 'Demo data: this is a preview, not real ratings.';
    note.textContent = n === 0 ? 'No ratings yet. Scan the code to be the first.' : '';

    var order = IDS.slice().sort(function (a, b) {
      var ta = data.topics[a], tb = data.topics[b];
      return avgOf(tb) - avgOf(ta) || tb.count - ta.count;
    });
    // FLIP: remember where rows were, reorder, then glide them from old to new spots
    var before = {};
    IDS.forEach(function (id) { before[id] = rows[id].getBoundingClientRect().top; });
    order.forEach(function (id, i) {
      var t = data.topics[id], li = rows[id], a = avgOf(t);
      li.classList.remove('skel');
      li.classList.toggle('lead', i === 0 && t.count > 0);
      li.querySelector('.rank').textContent = String(i + 1);
      tween(li.querySelector('.avg'), shown[id], a, id);
      var meter = li.querySelector('.meter');
      meter.style.setProperty('--w', (a / 5 * 100).toFixed(1) + '%');
      meter.setAttribute('aria-label', TOPICS[id] + ': ' + a.toFixed(1) + ' out of 5 stars from ' + t.count + ' ratings');
      li.querySelector('.count').textContent = t.count + (t.count === 1 ? ' rating' : ' ratings');
      var max = Math.max.apply(null, t.dist.concat([1]));
      li.querySelectorAll('.dist i').forEach(function (bar, k) { bar.style.setProperty('--f', (t.dist[k] / max).toFixed(3)); });
      rowsEl.appendChild(li);
    });
    if (!reduce.matches) {
      IDS.forEach(function (id) {
        var dy = before[id] - rows[id].getBoundingClientRect().top;
        if (Math.abs(dy) > 1) rows[id].animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }],
          { duration: 700, easing: 'cubic-bezier(0.16, 1, 0.3, 1)' });
      });
    }
  }

  function tween(el, from, to, id) {
    shown[id] = to;
    var fmt = function (v) { return v.toFixed(1) + '<small>/5</small>'; };
    if (reduce.matches || Math.abs(to - from) < 0.05) { el.innerHTML = fmt(to); return; }
    var t0 = performance.now(), d = 700;
    (function step(now) {
      var p = Math.min(1, (now - t0) / d), e = 1 - Math.pow(1 - p, 4);
      el.innerHTML = fmt(from + (to - from) * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }

  // ---------- data ----------
  var fake = null;
  function demoData() {
    if (!fake) fake = { responses: 0, topics: {} , w: { peptides: [1, 2, 4, 7, 9], skincare: [3, 4, 6, 4, 2], peds: [1, 1, 3, 6, 11], height: [2, 3, 5, 5, 4] } };
    var add = 1 + Math.floor(Math.random() * 3);
    fake.responses += add;
    IDS.forEach(function (id) {
      var t = fake.topics[id] || (fake.topics[id] = { count: 0, sum: 0, dist: [0, 0, 0, 0, 0] });
      for (var a = 0; a < add; a++) {
        var w = fake.w[id], tot = w.reduce(function (x, y) { return x + y; }), r = Math.random() * tot, k = 0;
        while (r > w[k]) { r -= w[k]; k++; }
        t.count++; t.sum += k + 1; t.dist[k]++;
      }
    });
    return Promise.resolve(JSON.parse(JSON.stringify(fake)));
  }

  function fetchData() {
    if (demo) return demoData();
    if (ENDPOINT.indexOf('https://') !== 0) return Promise.reject(new Error('unconfigured'));
    return fetch(ENDPOINT + '?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (j) { if (!j || !j.ok) throw new Error('bad'); return j; });
  }

  function tick() {
    clearTimeout(timer);
    fetchData().then(function (d) { lastOk = Date.now(); render(d); })
      .catch(function (err) {
        live.className = 'live warn';
        if (err.message === 'unconfigured') {
          liveText.textContent = 'Not connected to the ratings sheet yet';
          note.textContent = 'Add the Apps Script URL to apps-script/endpoint.txt and rebuild. Preview with ?demo.';
          return;
        }
        liveText.textContent = lastOk ? 'Reconnecting… showing the last numbers' : 'Can’t reach the ratings sheet. Retrying…';
      })
      .then(function () { if (!document.hidden) timer = setTimeout(tick, POLL_MS); });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) tick(); else clearTimeout(timer); });
  tick();
})();
</script>
</body>
</html>
